<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentAzure" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078d4" />
      <stop offset="100%" stop-color="#50e6ff" />
    </linearGradient>

    <linearGradient id="accentK8s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#326ce5" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    
    /* Dynamic CSS Animations */
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #50e6ff); }
    }
    
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }

    @keyframes gridFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 40; }
    }

    .anim-node {
      animation: pulseNode 4s infinite ease-in-out;
      transform-origin: center;
    }
    .anim-node-delayed {
      animation: pulseNode 4s infinite ease-in-out;
      animation-delay: 2s;
      transform-origin: center;
    }
    .anim-particle-1 { animation: floatParticle 6s infinite ease-in-out; }
    .anim-particle-2 { animation: floatParticle 8s infinite ease-in-out; animation-delay: 1s; }
    .anim-grid {
      stroke-dasharray: 8 8;
      animation: gridFlow 20s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Lines Background -->
  <g opacity="0.15">
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#38bdf8" stroke-width="1" class="anim-grid" />
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#38bdf8" stroke-width="1" class="anim-grid" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#38bdf8" stroke-width="1" class="anim-grid" />
    <line x1="300" y1="0" x2="300" y2="320" stroke="#38bdf8" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="320" stroke="#38bdf8" stroke-width="1" />
    <line x1="900" y1="0" x2="900" y2="320" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Dynamic Background Cluster Nodes & Connecting Lines (Non-intrusive on right side) -->
  <g opacity="0.6">
    <line x1="950" y1="100" x2="1080" y2="70" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="950" y1="100" x2="1040" y2="220" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 4" />
    <line x1="1080" y1="70" x2="1120" y2="180" stroke="#38bdf8" stroke-width="2" />
    <line x1="1040" y1="220" x2="1120" y2="180" stroke="#8b5cf6" stroke-width="2" />

    <!-- Animated Node Circles -->
    <circle cx="950" cy="100" r="14" fill="#0078d4" filter="url(#softGlow)" class="anim-node" />
    <circle cx="1080" cy="70" r="10" fill="#326ce5" filter="url(#softGlow)" class="anim-node-delayed" />
    <circle cx="1040" cy="220" r="18" fill="#8b5cf6" filter="url(#softGlow)" class="anim-node" />
    <circle cx="1120" cy="180" r="12" fill="#50e6ff" filter="url(#softGlow)" class="anim-node-delayed" />
  </g>

  <!-- Floating Ambient Particles -->
  <g class="anim-particle-1">
    <circle cx="150" cy="60" r="4" fill="#38bdf8" opacity="0.5" />
    <circle cx="850" cy="260" r="6" fill="#8b5cf6" opacity="0.4" />
  </g>
  <g class="anim-particle-2">
    <circle cx="100" cy="240" r="5" fill="#50e6ff" opacity="0.6" />
    <circle cx="700" cy="50" r="3" fill="#38bdf8" opacity="0.5" />
  </g>

  <!-- Foreground Content Block (Left Aligned, Fully Legible) -->
  <g transform="translate(60, 0)">

    <!-- Category Pill Badge -->
    <g transform="translate(0, 50)">
      <rect width="240" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="18" cy="16" r="6" fill="#10b981" />
      <text x="32" y="21" class="badge-text">MANAGED KUBERNETES &amp; AKS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title" filter="url(#glow)">Awesome Container Orchestration</text>

    <!-- Subtitle -->
    <text x="0" y="180" class="subtitle">Curated SaaS Platforms, Control Plane Pricing &amp; Production K8s Distributions</text>

    <!-- Feature Chips / Tags -->
    <g transform="translate(0, 220)">
      <!-- Chip 1: AKS -->
      <g transform="translate(0, 0)">
        <rect width="110" height="34" rx="8" fill="url(#accentAzure)" opacity="0.2" />
        <rect width="110" height="34" rx="8" fill="none" stroke="#0078d4" stroke-width="1.5" />
        <text x="55" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#50e6ff">Azure AKS</text>
      </g>

      <!-- Chip 2: Multi-Cloud -->
      <g transform="translate(125, 0)">
        <rect width="120" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
        <text x="60" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">Multi-Cloud</text>
      </g>

      <!-- Chip 3: Open-Source K8s -->
      <g transform="translate(260, 0)">
        <rect width="165" height="34" rx="8" fill="url(#accentK8s)" opacity="0.25" />
        <rect width="165" height="34" rx="8" fill="none" stroke="#8b5cf6" stroke-width="1.5" />
        <text x="82.5" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#c084fc">Open-Source K8s</text>
      </g>
    </g>
  </g>
</svg>
